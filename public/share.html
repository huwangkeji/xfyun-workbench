<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>对话分享 · 星火工作台</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">星</div>
      <span>星火 MaaS 文本对话工作台</span>
      <span class="tag">对话分享 · 只读</span>
    </div>
    <div class="top-actions">
      <a class="btn" href="/">打开工作台</a>
    </div>
  </header>

  <main class="share-page">
    <div class="share-card" id="shareCard">
      <div class="share-card-head">
        <div class="share-card-title" id="shareTitle">加载中…</div>
        <div class="share-card-sub" id="shareSub"></div>
      </div>
      <div class="share-card-body chat-messages" id="shareMessages"></div>
    </div>
    <div class="share-foot">由 星火工作台 分享 · 内容为分享时点的只读快照</div>
  </main>

  <div class="toast-wrap" id="toastWrap"></div>

  <script src="/assets/markdown.js"></script>
  <script src="/assets/share.js"></script>
</body>
</html>
