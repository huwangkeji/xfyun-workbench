<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 星火工作台后台管理</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="loginForm" autocomplete="off">
      <div class="login-brand">
        <div class="logo">管</div>
        <div class="t">星火工作台 · 后台管理</div>
        <div class="s">API 配置 / 运行日志 / 记忆管理</div>
      </div>

      <div class="login-hint" id="initHint">
        检测到当前仍是<b>初始密码</b>：请查看服务端控制台启动日志中打印的随机密码（仅显示一次）。登录后请立即「修改密码」。也可在 .env 中设置 <code>ADMIN_PASSWORD</code> 固定密码。
      </div>
      <div class="login-err" id="loginErr"></div>

      <label class="field">
        <span>管理密码</span>
        <input class="input" id="pwd" type="password" placeholder="请输入后台管理密码" autofocus />
      </label>
      <button class="btn primary login-btn" id="loginBtn" type="submit">登 录</button>

      <div class="login-foot">
        <a href="/">← 返回工作台</a><br/>
        忘记密码：设 <code>ADMIN_PASSWORD_RESET=1</code> 重启服务即可重置
      </div>
    </form>
  </div>

  <script>
    (function () {
      'use strict';
      var form = document.getElementById('loginForm');
      var pwd = document.getElementById('pwd');
      var err = document.getElementById('loginErr');
      var btn = document.getElementById('loginBtn');

      function showErr(msg) { err.textContent = msg; err.classList.add('show'); }
      function hideErr() { err.classList.remove('show'); }

      // 登录页状态：是否仍是初始密码（无需登录的探测接口）
      fetch('/api/admin/setup-status')
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.ok && d.data && d.data.isInitial) {
            document.getElementById('initHint').classList.add('show');
          }
        })
        .catch(function () { /* 服务未启动时静默，登录时自然报错 */ });

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        hideErr();
        var password = pwd.value;
        if (!password) { showErr('请输入密码'); return; }
        btn.disabled = true;
        btn.textContent = '登录中…';
        try {
          var resp = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: password })
          });
          var data = await resp.json().catch(function () { return {}; });
          if (resp.ok && data.ok) {
            location.replace('/admin');
            return;
          }
          showErr(data.error || ('登录失败（HTTP ' + resp.status + '）'));
        } catch (e2) {
          showErr('无法连接后端服务，请确认服务已启动（默认 http://127.0.0.1:4000）');
        } finally {
          btn.disabled = false;
          btn.textContent = '登 录';
        }
      });
    })();
  </script>
</body>
</html>
