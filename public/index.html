<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>同聪星火 · 文本对话</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <script>
    /* 移动端视口高度兜底（--app-h）：
       部分浏览器（旧版 Android WebView / 微信 X5 等）不支持 dvh 单位，100vh 会把页面撑到
       浏览器工具栏后面，导致吸底的输入区被挡住看不到。这里用 innerHeight 实时同步 --app-h，
       工具栏显隐 / 横竖屏切换 / 键盘弹出时自动校正；不支持的浏览器仍回退 100dvh → 100vh。 */
    (function () {
      var root = document.documentElement;
      var last = -1;
      function set(h) { if (h > 0 && h !== last) { last = h; root.style.setProperty('--app-h', h + 'px'); } }
      function sync() { set(window.innerHeight); }
      sync();
      window.addEventListener('resize', sync);
      window.addEventListener('orientationchange', function () { setTimeout(sync, 250); });
      /* 键盘弹出时（iOS / 布局视口不压缩的安卓）：用 visualViewport 校正，避免输入框被键盘盖住 */
      var vv = window.visualViewport;
      if (vv) {
        var vvSync = function () {
          if (vv.scale && vv.scale > 1.05) return; /* 捏合缩放时不跟随 */
          if (document.activeElement === document.getElementById('input')) {
            set(Math.min(vv.height, window.innerHeight));
          }
        };
        vv.addEventListener('resize', vvSync);
        document.addEventListener('focusin', function (e) { if (e.target && e.target.id === 'input') vvSync(); });
        document.addEventListener('focusout', function (e) { if (e.target && e.target.id === 'input') sync(); });
      }
    })();
  </script>
</head>
<body class="wb-page has-more">
  <header class="topbar">
    <div class="brand">
      <span class="brand-title">同聪星火</span>
    </div>
    <div class="top-actions">
      <a class="btn" href="/" title="返回门户首页">首页</a>
      <span class="tag" id="teamUserTag" style="display:none"></span>
      <a class="btn" id="meCenterBtn" href="/me" style="display:none" title="个人信息 / 我的数据 / 登录记录">员工中心</a>
      <button class="btn" id="teamLogoutBtn" style="display:none" title="退出员工账号登录">退出登录</button>
      <button class="btn" id="wbLogoutBtn" style="display:none" title="退出工作台登录">访客退出</button>
      <button class="btn" id="clearChatBtn">清空本会话</button>
      <a class="btn" href="/admin" id="adminLink">后台管理</a>
    </div>
    <!-- 移动端「⋯ 更多」下拉开关（桌面端隐藏，顶栏动作区始终展开） -->
    <button class="btn btn-sm top-more-btn" id="topMoreBtn" type="button" title="更多操作" aria-expanded="false">⋯</button>
  </header>

  <div class="workbench">
    <!-- 侧边栏：配置 / 会话（移动端为抽屉，由 chat-head 的 ☰ 唤出） -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head-mobile">
        <span>配置与会话</span>
        <button class="btn btn-sm" id="sidebarCloseBtn">收起</button>
      </div>
      <h3>选中的 API 配置</h3>
      <select class="select tail-select" id="configSelect"></select>

      <h3>会话</h3>
      <div class="conv-toolbar">
        <button class="btn primary btn-sm" id="newConvBtn">＋ 新增对话</button>
        <button class="btn danger btn-sm" id="delConvBtn">删除对话</button>
      </div>
      <div id="convList"></div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- 聊天区 -->
    <section class="chat-area">
      <div class="chat-head">
        <button class="btn btn-sm sidebar-toggle" id="sidebarToggle" title="配置与会话">☰</button>
        <div id="curConfigName" class="cur-config-name">未选择配置</div>
        <div class="chat-head-right">
          <div id="statusLine" class="typing"></div>
          <button class="btn btn-sm" id="shareBtn" title="把当前对话生成只读链接分享出去">🔗 分享对话</button>
        </div>
      </div>

      <div class="chat-messages" id="messages"></div>

      <div class="chat-input" id="chatInput">
        <!-- 参数工具栏：深度思考 / 思考强度 / 联网搜索 / 系统提示 -->
        <div class="params-bar" id="paramsBar">
          <button class="param-toggle" id="thinkingBtn" title="开启后模型进行深度思考（推理更充分，耗时更长）">
            <span class="dot"></span>🧠 深度思考
          </button>
          <span class="param-select" id="effortLabel" title="思考强度：high 均衡 / max 最强（耗时更长）">
            <span>强度</span>
            <select id="effortSelect" hidden>
              <option value="high">high</option>
              <option value="max">max</option>
            </select>
            <span class="seg" id="effortSeg">
              <button type="button" class="seg-btn" data-value="high">high</button>
              <button type="button" class="seg-btn" data-value="max">max</button>
            </span>
          </span>
          <button class="param-toggle" id="webSearchBtn" title="允许模型调用联网搜索获取实时信息">
            <span class="dot"></span>🌐 联网搜索
          </button>
          <span class="params-spacer"></span>
          <button class="param-btn" id="promptBtn" title="自定义系统提示（留空则使用配置中的默认值）">📝 系统提示</button>
        </div>
        <!-- 系统提示编辑面板 -->
        <div class="prompt-panel" id="promptPanel" style="display:none">
          <div class="prompt-head">
            <span>系统提示（System Prompt）</span>
            <span class="prompt-tip">留空则使用当前 API 配置里的默认系统提示</span>
          </div>
          <textarea id="promptInput" rows="3" placeholder="例如：你是一名资深前端工程师，回答简洁、给代码示例…"></textarea>
          <div class="prompt-actions">
            <span id="promptCount">0 字</span>
            <span class="params-spacer"></span>
            <button class="btn btn-sm" id="promptResetBtn">恢复配置默认</button>
            <button class="btn btn-sm primary" id="promptSaveBtn">收起</button>
          </div>
        </div>
        <div class="attach-row" id="attachRow" style="display:none"></div>
        <div class="wrap">
          <textarea id="input" placeholder="输入问题，Enter 发送 / Shift+Enter 换行；支持 Ctrl+V 粘贴或拖入图片（PNG/JPEG/GIF/WebP，单张≤8MB，最多9张）" rows="1"></textarea>
          <div class="send-side">
            <button class="icon-btn" id="attachBtn" title="选择图片上传（也可直接 Ctrl+V 粘贴 / 拖入）">📎</button>
            <button class="btn primary" id="sendBtn">发送</button>
          </div>
        </div>
        <div class="attach-hint">💡 上方工具栏可临时调整本次会话的思考/联网参数（记住选择）；系统提示会随每条请求一起发送。</div>
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden />
      </div>
    </section>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  <!-- 分享对话弹层 -->
  <div class="modal-mask" id="shareModal" style="display:none">
    <div class="modal">
      <div class="modal-head">
        <span>🔗 分享对话</span>
        <button class="close-x" id="shareModalClose">×</button>
      </div>
      <div class="modal-body">
        <div class="share-tip">生成只读链接：任何人凭链接可查看当前对话的<b>快照内容</b>（分享后继续对话不会影响已发出的链接）。</div>
        <div class="share-create-row">
          <label class="param-select" title="链接有效期，到期后自动失效">
            有效期
            <select id="shareExpiry">
              <option value="7">7 天</option>
              <option value="30" selected>30 天</option>
              <option value="90">90 天</option>
              <option value="0">永久</option>
            </select>
          </label>
          <button class="btn primary" id="shareCreateBtn">生成分享链接</button>
        </div>
        <div class="share-link-box" id="shareLinkBox" style="display:none">
          <input class="input" id="shareLinkInput" readonly />
          <button class="btn" id="shareLinkCopyBtn">复制链接</button>
        </div>
        <h4 class="share-list-title">已创建的分享</h4>
        <div id="shareList" class="share-list"></div>
      </div>
      <div class="modal-foot">
        <span class="share-foot-note">链接含随机凭证，请只分享给可信的人；发现泄露可在此撤销。</span>
      </div>
    </div>
  </div>

  <script src="/assets/markdown.js"></script>
  <script src="/assets/topbar-more.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
